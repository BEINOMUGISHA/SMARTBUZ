name: Deploy Convex

# ────────────────────────────────────────────────────────────────────────
# BUG-056 · The Convex backend was deployed by hand, so the web build and
# the backend could sit at different commits with nothing to say so.
#
# This workflow deploys the backend on a push to `main`, but ONLY when the
# repository has the deploy secrets configured. Without them the job runs and
# does nothing: the backend is left exactly as it was, and the run says so.
#
# Secrets cannot be referenced directly in an `if:` condition, so they are
# exposed to the job as environment variables and the steps are guarded on
# those. That is the pattern GitHub documents for the same reason.
# ────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two backend deploys overlap: Convex applies a deploy as a unit
# and an interleaved one leaves the backend in an unpredictable state.
concurrency:
  group: convex-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the Convex backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # The deploy key is what authorises the push; the URL is which
      # deployment is being pushed to. Both must be present.
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      CONVEX_URL: ${{ secrets.CONVEX_URL }}
      # ──────────────────────────────────────────────────────────────────
      # WHICH deployment this job pushes to.
      #
      # `npx convex deploy` publishes to the *production* deployment of the
      # Convex **project**. The web app does not necessarily point there: this
      # installation's app runs on the pinned deployment named in
      # CONVEX_DEPLOYMENT, and `npx convex deploy` would silently publish to a
      # different one — the deploy would report success and the app would
      # keep running the old code.
      #
      # That is exactly what happened on 21 Nov 2026: the deploy "succeeded"
      # and the fix was not live. So the deployment is now named explicitly,
      # and the job verifies afterwards that the deployment the app actually
      # uses is serving the new code.
      #
      # Set this repository *variable* (not secret) to the pinned deployment
      # id, e.g. `dev:affable-panda-681`. When it is absent the job keeps its
      # previous behaviour of publishing to the project's production
      # deployment.
      # ──────────────────────────────────────────────────────────────────
      CONVEX_DEPLOYMENT: ${{ vars.CONVEX_DEPLOYMENT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report whether the backend can be deployed
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ] || [ -z "$CONVEX_URL" ]; then
            echo "::notice::CONVEX_DEPLOY_KEY and/or CONVEX_URL are not configured as repository secrets. The Convex backend was NOT deployed; it is unchanged."
            exit 0
          fi
          echo "Convex deploy secrets are present. The backend will be deployed."

      - name: Typecheck the Convex functions before deploying them
        # A backend that does not compile must never reach the deployment.
        if: ${{ env.CONVEX_DEPLOY_KEY != '' && env.CONVEX_URL != '' }}
        run: npx tsc --noEmit -p convex/tsconfig.json

      - name: Deploy the Convex functions and schema
        if: ${{ env.CONVEX_DEPLOY_KEY != '' && env.CONVEX_URL != '' }}
        run: |
          set -euo pipefail

          # ──────────────────────────────────────────────────────────────
          # WHICH deployment to publish to
          #
          # `npx convex deploy` publishes to the *production* deployment of
          # the Convex **project**. The web app does not necessarily point
          # there: this installation's app runs on the pinned deployment
          # affable-panda-681, and `npx convex deploy` silently publishes to
          # a different one — the deploy reports success and the app keeps
          # running the old code.
          #
          # That is exactly what happened on 21 Nov 2026: the deploy
          # "succeeded", the job went green, and the fix was not live.
          #
          # So the deployment is named explicitly:
          #
          #   1. the CONVEX_DEPLOYMENT repository variable, if it is set;
          #   2. otherwise the deployment whose URL the app is configured to
          #      use, derived from the CONVEX_URL secret.
          #
          # Deriving it from CONVEX_URL is the important part: the secret
          # already names the deployment the app talks to, so there is
          # nothing left to configure and nothing left to get wrong.
          # ──────────────────────────────────────────────────────────────
          target="$CONVEX_DEPLOYMENT"
          if [ -z "$target" ]; then
            name="$(printf '%s' "$CONVEX_URL" | sed -E 's#^https?://([^.]+)\..*$#\1#')"
            if [ -z "$name" ] || [ "$name" = "$CONVEX_URL" ]; then
              echo "::error::Could not work out which deployment $CONVEX_URL names."
              exit 1
            fi
            echo "No CONVEX_DEPLOYMENT variable set; using the deployment the app uses: $name"
          else
            name="$(printf '%s' "$target" | sed -E 's#^(dev|prod):##')"
            echo "Publishing to the pinned deployment $target"
          fi

          # `convex dev --once` is the command that publishes to a named
          # deployment. It needs the deployment in the environment, so it is
          # handed over in an env file rather than through a variable the
          # CLI would not read.
          env_file="$RUNNER_TEMP/convex-target.env"

          # A cloud deployment is either the project's development
          # deployment or its production one, and the prefix has to match.
          # Try both forms and take the one that works, rather than
          # publishing to whichever the CLI happens to default to.
          published=0
          for prefix in dev prod; do
            printf 'CONVEX_DEPLOYMENT=%s:%s\n' "$prefix" "$name" > "$env_file"
            echo "Publishing to $prefix:$name ..."
            if npx convex dev --once --env-file "$env_file"; then
              published=1
              break
            fi
            echo "::warning::Could not publish to $prefix:$name."
          done

          if [ "$published" -ne 1 ]; then
            echo "::error::Could not publish to $name in either form."
            echo "::error::The deployment the app uses is NOT running this commit's code."
            exit 1
          fi

      # ──────────────────────────────────────────────────────────────────
      # Give the tenants that have no subscription row one.
      #
      # The entitlement gate now fails closed: a business with no
      # subscription is not licensed and cannot record anything new. That
      # is the correct behaviour, but it would catch any tenant that was
      # registered through the path that never created one.
      #
      # So the backfill runs immediately after the deploy, which makes the
      # window in which such a tenant is blocked a matter of seconds rather
      # than of however long somebody takes to notice.
      # ──────────────────────────────────────────────────────────────────
      - name: Give the tenants without a subscription one
        if: ${{ env.CONVEX_DEPLOY_KEY != '' && env.CONVEX_URL != '' }}
        env:
          # The script talks to the deployment that was just published.
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.CONVEX_URL }}
          SMARTBUZ_SERVER_SECRET: ${{ secrets.SMARTBUZ_SERVER_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: node scripts/backfill-subscriptions.mjs

      - name: Verify the deployment answers
        if: ${{ env.CONVEX_DEPLOY_KEY != '' && env.CONVEX_URL != '' }}
        run: |
          set -euo pipefail
          site_url="${CONVEX_URL%.convex.cloud}.convex.site"
          echo "Deployment version:"
          curl -fsS --max-time 15 "$CONVEX_URL/version"
          echo ""
          echo "Published signing keys (must be a JSON document with a keys array):"
          curl -fsS --max-time 15 "$site_url/auth/jwks" | head -c 300
          echo ""

      # ──────────────────────────────────────────────────────────────────
      # Prove that the deployment the *web app* talks to is the one that was
      # just published.
      #
      # A deploy that goes to the wrong deployment reports success and changes
      # nothing the user can see, so "the job went green" is not evidence that
      # the fix is live. This step asks the deployment the app points at
      # whether it knows a function that only exists in the new code, and
      # fails the job when it does not.
      # ──────────────────────────────────────────────────────────────────
      - name: Prove the app's deployment is serving the new code
        if: ${{ env.CONVEX_DEPLOY_KEY != '' && env.CONVEX_URL != '' }}
        run: |
          set -euo pipefail

          # The check compares the *whole* function list: what this commit
          # defines, against what the deployment the app points at serves.
          #
          # It used to look for one function's name — a name that was
          # already on the deployment from an earlier deploy — so a deploy
          # that went to the wrong deployment still passed. Every function
          # this commit defines has to be there, or the job fails.
          node scripts/verify-deployment.mjs "$CONVEX_URL"
